<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe: Login</title>
<style>
  body { font-family: sans-serif; background:#eee; padding: 40px; }
  .box { border: 2px dashed #888; background: #fff; max-width: 380px; margin: 0 auto; padding: 24px; }
  .field { border: 1px solid #999; padding: 8px; margin-bottom: 12px; color:#777; }
  .btn { border: 1px solid #333; text-align:center; padding: 8px; background:#ddd; }
  h2 { text-align:center; }
  .topbar { background:#333; color:#fff; text-align:center; padding:10px; margin-bottom:20px; }
</style>
</head>
<body>
  <div class="topbar">Expert Decision Replay Platform (wireframe only)</div>
  <div class="box">
    <h2>Login</h2>
    <div class="field">Email input</div>
    <div class="field">Password input</div>
    <div class="btn">Login button</div>
    <p style="text-align:center; color:#777;">Link: "Register here"</p>
  </div>
</body>
</html>
