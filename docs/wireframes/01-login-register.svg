  <text x="90" y="160" font-family="Arial" font-size="20" font-weight="bold" fill="#111827">Expert Decision</text>
  <text x="90" y="185" font-family="Arial" font-size="20" font-weight="bold" fill="#111827">Replay Platform</text>

  <!-- tabs -->
  <rect x="90" y="210" width="90" height="30" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <text x="110" y="230" font-family="Arial" font-size="12" fill="#4f46e5">Login</text>
  <rect x="185" y="210" width="110" height="30" fill="none" stroke="#d1d5db" stroke-width="1"/>
