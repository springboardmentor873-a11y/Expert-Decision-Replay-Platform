<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="600" fill="#f3f4f6"/>
  <rect x="60" y="80" width="380" height="440" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>

