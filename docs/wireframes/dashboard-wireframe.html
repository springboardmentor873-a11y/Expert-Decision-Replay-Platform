<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe: Dashboard</title>
<style>
  body { font-family: sans-serif; background:#eee; padding: 40px; }
  .box { border: 2px dashed #888; background: #fff; max-width: 600px; margin: 0 auto; padding: 24px; }
  .field { border: 1px solid #999; padding: 8px; margin-bottom: 10px; color:#777; }
  .topbar { background:#333; color:#fff; display:flex; justify-content:space-between; padding:10px 16px; margin-bottom:20px; max-width:600px; margin-left:auto; margin-right:auto; }
  .link { color:#336; text-decoration: underline; margin-top: 14px; display:inline-block; }
</style>
</head>
<body>
  <div class="topbar"><span>Expert Decision Replay Platform</span><span>[Logout]</span></div>
  <div class="box">
    <h2>Welcome, &lt;Full Name&gt;</h2>
    <div class="field">Full Name: &lt;value&gt;</div>
    <div class="field">Email: &lt;value&gt;</div>
    <div class="field">Role: &lt;value&gt;</div>
    <div class="field">Team: &lt;value&gt;</div>
    <span class="link">[Manage Users →] (Administrators only)</span>
  </div>
</body>
</html>
