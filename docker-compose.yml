services:
  # ========================================================
  # 1. PostgreSQL Database Service
  # ========================================================
  postgres:
    image: postgres:15-alpine
    container_name: edrp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expert_decision_replay}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expert_decision_replay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edrp-network

  # ========================================================
  # 2. Redis Caching & Session Service
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: edrp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edrp-network

  # ========================================================
  # 3. FastAPI Backend Application
  # ========================================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: edrp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-expert_decision_replay}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-expert_decision_replay_production_jwt_secret_2026}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - edrp-network

  # ========================================================
  # 4. React Frontend (Vite + Nginx Reverse Proxy)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edrp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"
    networks:
      - edrp-network

# ========================================================
# Named Volumes & Networks
# ========================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  edrp-network:
    driver: bridge
