version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./expert_decision_replay.db
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost"]
    volumes:
      - ./expert_decision_replay.db:/app/expert_decision_replay.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: always
