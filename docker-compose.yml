version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edrp_db
    environment:
      POSTGRES_USER: edrp_user
      POSTGRES_PASSWORD: edrp_password
      POSTGRES_DB: edrp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edrp_user -d edrp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: edrp_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://edrp_user:edrp_password@postgres:5432/edrp_db
      SECRET_KEY: edrp-super-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edrp_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
