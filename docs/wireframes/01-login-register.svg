  <!-- fields -->
  <text x="90" y="270" font-family="Arial" font-size="11" fill="#374151">Email</text>
  <rect x="90" y="278" width="320" height="34" rx="6" fill="none" stroke="#d1d5db"/>

  <text x="90" y="335" font-family="Arial" font-size="11" fill="#374151">Password</text>
  <rect x="90" y="343" width="320" height="34" rx="6" fill="none" stroke="#d1d5db"/>

  <rect x="90" y="400" width="320" height="40" rx="6" fill="#4f46e5"/>
  <text x="220" y="425" font-family="Arial" font-size="13" fill="#ffffff">Log in</text>

  <text x="250" y="480" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Register tab shows the same form</text>
  <text x="250" y="495" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">plus Full Name and a Role dropdown</text>
